                <defs>
                  <linearGradient id="grid-line-glow" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15" />
                    <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.75" />
                    <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.3" />
                  </linearGradient>
                  <linearGradient id="grid-edge-mask" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#000000" stop-opacity="0" />
                    <stop offset="15%" stop-color="#ffffff" stop-opacity="1" />
                    <stop offset="85%" stop-color="#ffffff" stop-opacity="1" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
                  </linearGradient>
                  <mask id="grid-fade-mask">
                    <rect x="0" y="0" width="320" height="64" fill="url(#grid-edge-mask)" />
                  </mask>
                </defs>
                <g mask="url(#grid-fade-mask)" stroke="url(#grid-line-glow)" stroke-width="1.3">
                  <!-- Horizontal perspective lines -->
                  <line x1="0" y1="8" x2="320" y2="8" stroke-opacity="0.3" />
                  <line x1="0" y1="16" x2="320" y2="16" stroke-opacity="0.45" />
                  <line x1="0" y1="26" x2="320" y2="26" stroke-opacity="0.65" />
                  <line x1="0" y1="40" x2="320" y2="40" stroke-opacity="0.85" />
                  <line x1="0" y1="60" x2="320" y2="60" stroke-opacity="1.0" />
                  <!-- Perspective lines radiating from center horizon down to bottom -->
                  <line x1="160" y1="4" x2="160" y2="64" />
                  <line x1="160" y1="4" x2="120" y2="64" />
                  <line x1="160" y1="4" x2="200" y2="64" />
                  <line x1="160" y1="4" x2="80" y2="64" />
                  <line x1="160" y1="4" x2="240" y2="64" />
                  <line x1="160" y1="4" x2="40" y2="64" />
                  <line x1="160" y1="4" x2="280" y2="64" />
                  <line x1="160" y1="4" x2="0" y2="64" />
                  <line x1="160" y1="4" x2="320" y2="64" />
                </g>
              </svg>
            </div>

            <!-- Stats Breakdown Rows (Clean vector SVG icons, NO EMOJIS) -->
            <div class="flex-breakdown-list">
              <!-- Row 1: Time Left -->
              <div class="breakdown-row">
                <div class="breakdown-label-col">
                  <div class="breakdown-icon-box icon-box-time">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                      <circle cx="12" cy="13" r="8"/>
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4l2.5 2.5"/>
                      <path stroke-linecap="round" d="M10 2h4"/>
                      <path stroke-linecap="round" d="M12 2v2.5"/>
                    </svg>
                  </div>
                  <span class="breakdown-label">Time Left</span>
                </div>
                <div class="breakdown-value-col">
                  <span id="flex-time-bonus" class="pts-val">+0 pts</span>
                  <span id="flex-time-detail" class="detail-val">(0.0s)</span>
                </div>
              </div>

              <!-- Row 2: Flips Efficiency -->
              <div class="breakdown-row">
                <div class="breakdown-label-col">
                  <div class="breakdown-icon-box icon-box-flips">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                      <circle cx="12" cy="12" r="9"/>
                      <circle cx="12" cy="12" r="5"/>
                      <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                    </svg>
                  </div>
                  <span class="breakdown-label">Flips Efficiency</span>
                </div>
                <div class="breakdown-value-col">
                  <span id="flex-flip-bonus" class="pts-val">+0 pts</span>
                  <span id="flex-flip-detail" class="detail-val">(0 flips)</span>
                </div>
              </div>

              <!-- Row 3: Streak Bonus -->
              <div class="breakdown-row">
                <div class="breakdown-label-col">
                  <div class="breakdown-icon-box icon-box-streak">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                      <path d="M12 23c4.97 0 9-4.03 9-9 0-3.6-2.1-6.72-5.15-8.15C15.4 7.2 14.3 8.8 13.5 10c-.8-1.5-1.5-3.6-1.5-6 0-.6-.2-1.2-.5-1.7C8.2 4.4 5 8.7 5 14c0 4.97 4.03 9 9 9zm-1-8.5c0-1.4.8-2.6 1.8-3.3 1.2 1.3 2.2 2.7 2.2 4.3 0 1.66-1.34 3-3 3s-3-1.34-3-3c0-.3.1-.7.2-1 .3-.3.8-.5 1.8-.5v.5z"/>
                    </svg>
                  </div>
                  <span class="breakdown-label">Streak Bonus</span>
                </div>
                <div class="breakdown-value-col">
                  <span id="flex-streak-bonus" class="pts-val pts-highlight-gold">+0 pts</span>
                </div>
              </div>
            </div>

            <!-- Cosmetic Skin Unlocks (Clean SVG vector badges, NO EMOJIS) -->
            <div id="flex-unlocks" class="flex-unlocks-box hidden"></div>
          </div>

          <!-- Bottom Action Buttons Zone -->
          <div class="flex-actions-container">
            <!-- Primary Action: Glossy 3D Yellow Capsule CTA -->
            <div class="flex-primary-cta-group">
              <span class="burst-tick-ray tick-left-1"></span>
              <span class="burst-tick-ray tick-left-2"></span>
              <span class="burst-tick-ray tick-left-3"></span>
              <button id="btn-flex-play-again" class="btn-flex-play-cta" aria-label="Play Again">
                <span id="btn-flex-play-text">PLAY AGAIN</span>
                <svg class="icon-play-triangle" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M8 5v14l11-7z" />
                </svg>
              </button>
              <span class="burst-tick-ray tick-right-1"></span>
              <span class="burst-tick-ray tick-right-2"></span>
              <span class="burst-tick-ray tick-right-3"></span>
            </div>

            <!-- Secondary Action: Glossy Deep Royal Blue Capsule with Chevrons & Trophy -->
            <button id="btn-flex-leaderboard" class="btn-flex-leaderboard-cta" aria-label="View Friend Leaderboard">
              <svg class="chev-nav chev-left" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
              <div class="leaderboard-btn-label">
                <svg class="icon-trophy-svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V19H8v2h8v-2h-3v-3.1c1.8-.46 3.16-1.95 3.61-3.96C19.08 11.63 21 9.55 21 7V5c0-1.1-.9-2-2-2zM5 8V5h2v4.82C5.84 9.4 5 8.78 5 8zm14 0c0 .78-.84 1.4-2 1.82V5h2v3z"/>
                </svg>
                <span>VIEW FRIEND LEADERBOARD</span>
              </div>
              <svg class="chev-nav chev-right" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>

            <!-- Tertiary Action: Clean Sky Blue Link -->
            <button id="btn-flex-change-level" class="btn-flex-lobby-link" aria-label="Return to Lobby">
              BACK TO LOBBY
            </button>
          </div>

        </div>
      </div>
    </div>

    <!-- Application Script Entry Point -->
  </body>
</html>
