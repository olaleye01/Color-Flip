<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Color Flip - 3D Snapchat Web Lens</title>
    <meta name="description" content="A fast-paced 3D visual-memory color matching game for Snapchat Web Lens." />

    <!-- Google Fonts: Lilita One (logo), Montserrat (Black/Bold), Rubik, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lilita+One&family=Montserrat:wght@700;800;900&family=Rubik:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!-- App Container (9:16 Vertical Safe Ratio on Mobile, Centered Mobile Stage on Desktop) -->
    <div id="lens-stage">
      <!-- Neon Arcade Backdrop (behind transparent WebGL canvas) -->
      <div class="stage-backdrop" aria-hidden="true">
        <div class="stage-spotlight"></div>
        <span class="bokeh b1"></span>
        <span class="bokeh b2"></span>
        <span class="bokeh b3"></span>
        <span class="bokeh b4"></span>
        <span class="bokeh b5"></span>
        <span class="bokeh b6"></span>
        <div class="board-glow"></div>
        <span class="float-tile ft-yellow"></span>
        <span class="float-tile ft-pink"></span>
        <span class="float-tile ft-blue"></span>
        <span class="float-tile ft-purple"></span>
        <span class="float-tile ft-gold"></span>
      </div>

      <!-- 3D PlayCanvas WebGL Canvas -->
      <canvas id="application-canvas"></canvas>

      <!-- HTML/CSS Glassmorphic Overlay Layer -->
      <div id="ui-overlay">
        <!-- Top Safe Area Spacer (140px Snapchat Chrome Inset) -->
        <header class="top-safe-inset" aria-hidden="true"></header>

        <!-- SCREEN 1: PRE-GAME LOBBY & LEVEL SELECTOR -->
        <section id="lobby-screen" class="screen-view">
          <!-- Personal Best Header Pill + Settings -->
          <div class="lobby-header-row">
            <div class="user-best-pill">
              <div class="avatar-ring">
                <img
                  id="lobby-avatar"
                  class="avatar-thumb"
                  src="./assets/avatar_default.png"
                  alt="Player Avatar"
                  onerror="this.src='./assets/avatar_default.png'"
                />
              </div>
              <div class="best-text-group">
                <span class="best-label">HIGH SCORE</span>
                <span id="lobby-high-score" class="best-score">0</span>
              </div>
            </div>

            <button id="btn-settings" class="btn-icon-round" aria-label="Toggle sound" aria-pressed="false">
              <svg class="icon-gear" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54A.48.48 0 0013.9 2h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.7 8.47a.48.48 0 00.12.61l2.03 1.58c-.04.31-.07.63-.07.94s.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 00-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z" />
              </svg>
              <span id="sound-state-badge" class="sound-badge" aria-hidden="true">ON</span>
            </button>
          </div>

          <!-- Title Logo -->
          <div class="title-container">
            <h1 class="game-logo" aria-label="Color Flip">
              <span class="logo-spark s1"></span>
              <span class="logo-spark s2"></span>
              <span class="logo-spark s3"></span>
              <span class="logo-spark s4"></span>
              <span class="logo-word logo-color" aria-hidden="true">COLOR</span>
              <span class="logo-flip-row" aria-hidden="true">
                <svg class="flip-arrow arrow-left" viewBox="0 0 40 60" width="28" height="44">
                  <path d="M30 6 C10 14 8 42 26 54" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
                  <path d="M18 4 L34 4 L26 18 Z" fill="currentColor" transform="rotate(-20 26 8)" />
                </svg>
                <span class="logo-word logo-flip">
                  <span class="fl f">F</span><span class="fl l">L</span><span class="fl i">I</span><span class="fl p">P</span>
                </span>
                <svg class="flip-arrow arrow-right" viewBox="0 0 40 60" width="28" height="44">
                  <path d="M10 54 C30 46 32 18 14 6" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
                  <path d="M6 56 L22 56 L14 42 Z" fill="currentColor" transform="rotate(-20 14 52)" />
                </svg>
              </span>
            </h1>
            <p class="tagline">3D VISUAL MEMORY</p>
          </div>

          <!-- Middle Viewport Spacer (Keeps 3D 4x4 Board Prominent & Clear) -->
          <div class="viewport-spacer"></div>

          <!-- Bottom Action Zone -->
          <div class="lobby-actions-bottom">
            <!-- Primary Play CTA -->
            <div class="play-cta-wrap">
              <span class="cta-tick t-left-a"></span>
              <span class="cta-tick t-left-b"></span>
              <button id="btn-play" class="btn-primary-cta btn-play-hero" aria-label="Start Game">
                <svg class="icon-play" viewBox="0 0 24 24" width="30" height="30">
                  <path fill="currentColor" d="M7 4.5v15a1 1 0 001.52.85l12-7.5a1 1 0 000-1.7l-12-7.5A1 1 0 007 4.5z" />
                </svg>
                <span>PLAY</span>
              </button>
              <span class="cta-tick t-right-a"></span>
              <span class="cta-tick t-right-b"></span>
            </div>

            <!-- Secondary Actions -->
            <div class="secondary-btn-row">
              <button id="btn-leaderboard" class="btn-secondary-pill" aria-label="View Snapchat Leaderboard">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                <span>LEADERBOARD</span>
                <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
              </button>

              <button id="btn-skins" class="btn-secondary-pill" aria-label="Customize Tile Back Skins">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 000 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16a5 5 0 005-5c0-4.42-4.03-8-9-8z" />
                  <circle cx="7.5" cy="11.5" r="1.2" fill="currentColor" stroke="none" />
                  <circle cx="10" cy="7.5" r="1.2" fill="currentColor" stroke="none" />
                  <circle cx="14.5" cy="7.5" r="1.2" fill="currentColor" stroke="none" />
                  <circle cx="17" cy="11" r="1.2" fill="currentColor" stroke="none" />
                </svg>
                <span>TILE SKIN</span>
                <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
              </button>
            </div>
          </div>
        </section>

        <!-- SCREEN 2: PHASE BANNER TOAST (0.0s – 4.0s) -->
        <aside id="phase-banner" class="phase-banner-toast hidden" aria-live="assertive">
          <div class="phase-content">
            <span id="phase-text" class="phase-title">🎲 SHUFFLING COLORS...</span>
            <div class="phase-bar-track">
              <div id="phase-bar-fill" class="phase-bar-fill"></div>
            </div>
          </div>
        </aside>

        <!-- SCREEN 3: ACTIVE IN-GAME HUD -->
        <section id="hud-screen" class="screen-view hidden">
          <!-- 3-Pod Top HUD Bar -->
          <div class="hud-top-bar">
            <!-- Pod 1: Live Bitmoji Spectator -->
            <div id="hud-avatar-container" class="hud-pod hud-avatar-pod">
              <img
                id="hud-avatar-img"
                class="hud-avatar-pic"
                src="./assets/avatar_default.png"
                alt="Spectator Bitmoji"
                onerror="this.src='./assets/avatar_default.png'"
              />
            </div>

            <!-- Pod 2: Precision Countdown Timer -->
            <div class="hud-pod hud-timer-pod">
              <span id="hud-timer" class="timer-digits">60.0s</span>
              <span class="pod-label">TIMER</span>
            </div>

            <!-- Pod 3: Flip Efficiency Counter -->
            <div class="hud-pod hud-flips-pod">
              <div class="flips-value-row">
                <span id="hud-flips" class="flips-digits">0</span>
                <span id="hud-pace-dot" class="pace-dot pace-green" title="Efficiency Pace"></span>
              </div>
              <span class="pod-label">FLIPS</span>
            </div>
          </div>

          <!-- Sub Badge Row -->
          <div class="hud-sub-badge-row">
            <div id="hud-level-badge" class="hud-mult-pill">SOLID MODE</div>
          </div>

          <!-- Middle Viewport Spacer (Keeps 3D Board Clear) -->
          <div class="viewport-spacer"></div>

          <!-- Bottom Streak Meter & Quick Restart Zone -->
          <div class="hud-bottom-actions">
            <div id="streak-bar" class="dynamic-streak-bar hidden">
              <span id="streak-text" class="streak-text">🔥 2x STREAK (+500 PTS)</span>
            </div>

            <button id="btn-restart" class="btn-restart-pill" aria-label="Restart Board Instantly">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span>RESTART</span>
            </button>
          </div>
        </section>

        <!-- SCREEN 4: TILE SKIN DRAWER (MODAL BOTTOM SHEET) -->
        <div id="skin-drawer-overlay" class="modal-backdrop hidden"></div>
        <div id="skin-drawer" class="bottom-sheet-drawer hidden" role="dialog" aria-modal="true" aria-label="Tile Skin Selector">
          <div class="drawer-header">
            <h3 class="drawer-title">SELECT TILE EMBLEM</h3>
            <button id="btn-close-skins" class="btn-close-icon" aria-label="Close Skins Drawer">
              <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div id="skin-list" class="skin-list-grid"></div>
        </div>

        <!-- SCREEN 5: POST-GAME FLEX CARD MODAL -->
        <div id="flex-modal-overlay" class="modal-backdrop hidden"></div>
        <div id="flex-modal" class="flex-card-modal hidden" role="dialog" aria-modal="true" aria-label="Round Summary">
          <div class="glass-card flex-receipt-card">
            <div class="flex-receipt-header">
              <h2 id="flex-title" class="flex-title title-win">★ BOARD CLEARED! ★</h2>
              <div class="flex-avatar-frame">
                <img id="flex-avatar" src="./assets/avatar_default.png" alt="Victory Bitmoji" onerror="this.src='./assets/avatar_default.png'" />
              </div>
            </div>

            <div class="flex-score-block">
              <span class="flex-score-label">FINAL SCORE</span>
              <div id="flex-score" class="flex-score-number">0</div>
              <div id="flex-pb-badge" class="pb-badge hidden">🏆 NEW PERSONAL BEST!</div>
            </div>

            <div class="receipt-divider"></div>

            <table class="receipt-table">
              <tbody>
                <tr>
                  <td>⏱ Time Left</td>
                  <td id="flex-time-bonus" class="table-val">+0 pts</td>
                </tr>
                <tr>
                  <td>🎯 Flips Efficiency</td>
                  <td id="flex-flip-bonus" class="table-val">+0 pts</td>
                </tr>
                <tr>
                  <td>🔥 Streak Bonus</td>
                  <td id="flex-streak-bonus" class="table-val">+0 pts</td>
                </tr>
              </tbody>
            </table>

            <div id="flex-unlocks" class="unlock-toasts-box hidden"></div>

            <div class="flex-actions-col">
              <button id="btn-flex-play-again" class="btn-primary-cta">
                <span>PLAY AGAIN</span>
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M8 5v14l11-7z" />
                </svg>
              </button>

              <button id="btn-flex-leaderboard" class="btn-secondary-pill">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                <span>VIEW FRIEND LEADERBOARD</span>
              </button>

              <button id="btn-flex-change-level" class="btn-subtle-link">
                BACK TO LOBBY
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Application Script Entry Point -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
