<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Color Flip - 3D Snapchat Web Lens</title>
    <meta name="description" content="A fast-paced 3D visual-memory color matching game for Snapchat Web Lens." />

    <!-- Google Fonts: Montserrat (Black/Bold), Rubik, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&family=Rubik:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!-- App Container (9:16 Vertical Safe Ratio on Mobile, Centered Mobile Stage on Desktop) -->
    <div id="lens-stage">
      <!-- 3D PlayCanvas WebGL Canvas -->
      <canvas id="application-canvas"></canvas>

      <!-- HTML/CSS Glassmorphic Overlay Layer -->
      <div id="ui-overlay">
        <!-- Top Safe Area Spacer (140px Snapchat Chrome Inset) -->
        <header class="top-safe-inset" aria-hidden="true"></header>

        <!-- SCREEN 1: PRE-GAME LOBBY & LEVEL SELECTOR -->
        <section id="lobby-screen" class="screen-view">
          <!-- Personal Best Header Pill -->
          <div class="lobby-header-row">
            <div class="user-best-pill">
              <img
                id="lobby-avatar"
                class="avatar-thumb"
                src="./assets/avatar_default.png"
                alt="Player Avatar"
                onerror="this.src='./assets/avatar_default.png'"
              />
              <div class="best-text-group">
                <span class="best-label">HIGH SCORE</span>
                <span id="lobby-high-score" class="best-score">0</span>
              </div>
            </div>
          </div>

          <!-- Title Logo -->
          <div class="title-container">
            <h1 class="game-logo">COLOR FLIP</h1>
            <p class="tagline">3D VISUAL MEMORY</p>
          </div>

          <!-- Middle Viewport Spacer (Keeps 3D 4x4 Board Prominent & Clear) -->
          <div class="viewport-spacer"></div>

          <!-- Bottom Action Zone -->
          <div class="lobby-actions-bottom">
            <!-- Primary Play CTA -->
            <button id="btn-play" class="btn-primary-cta" aria-label="Start Game">
              <span>P L A Y</span>
              <svg class="icon-play" viewBox="0 0 24 24" width="24" height="24">
                <path fill="currentColor" d="M8 5v14l11-7z" />
              </svg>
            </button>

            <!-- Secondary Actions -->
            <div class="secondary-btn-row">
              <button id="btn-leaderboard" class="btn-secondary-pill" aria-label="View Snapchat Leaderboard">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                <span>LEADERBOARD</span>
              </button>

              <button id="btn-skins" class="btn-secondary-pill" aria-label="Customize Tile Back Skins">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4 8.001 8.001 0 018.7-7.9A4.002 4.002 0 0116 11a4 4 0 01-.8 7.9A4.004 4.004 0 0111 21H7z" />
                </svg>
                <span>TILE SKIN</span>
              </button>
            </div>
          </div>
        </section>

        <!-- SCREEN 2: PHASE BANNER TOAST (0.0s – 4.0s) -->
        <aside id="phase-banner" class="phase-banner-toast hidden" aria-live="assertive">
          <div class="phase-content">
            <span id="phase-text" class="phase-title">🎲 SHUFFLING COLORS...</span>
            <div class="phase-bar-track">
              <div id="phase-bar-fill" class="phase-bar-fill"></div>
            </div>
          </div>
        </aside>

        <!-- SCREEN 3: ACTIVE IN-GAME HUD -->
        <section id="hud-screen" class="screen-view hidden">
          <!-- 3-Pod Top HUD Bar -->
          <div class="hud-top-bar">
            <!-- Pod 1: Live Bitmoji Spectator -->
            <div id="hud-avatar-container" class="hud-pod hud-avatar-pod">
              <img
                id="hud-avatar-img"
                class="hud-avatar-pic"
                src="./assets/avatar_default.png"
                alt="Spectator Bitmoji"
                onerror="this.src='./assets/avatar_default.png'"
              />
            </div>

            <!-- Pod 2: Precision Countdown Timer -->
            <div class="hud-pod hud-timer-pod">
              <span id="hud-timer" class="timer-digits">60.0s</span>
              <span class="pod-label">TIMER</span>
            </div>

            <!-- Pod 3: Flip Efficiency Counter -->
            <div class="hud-pod hud-flips-pod">
              <div class="flips-value-row">
                <span id="hud-flips" class="flips-digits">0</span>
                <span id="hud-pace-dot" class="pace-dot pace-green" title="Efficiency Pace"></span>
              </div>
              <span class="pod-label">FLIPS</span>
            </div>
          </div>

          <!-- Sub Badge Row -->
          <div class="hud-sub-badge-row">
            <div id="hud-level-badge" class="hud-mult-pill">SOLID MODE</div>
          </div>

          <!-- Middle Viewport Spacer (Keeps 3D Board Clear) -->
          <div class="viewport-spacer"></div>

          <!-- Bottom Streak Meter & Quick Restart Zone -->
          <div class="hud-bottom-actions">
            <div id="streak-bar" class="dynamic-streak-bar hidden">
              <span id="streak-text" class="streak-text">🔥 2x STREAK (+500 PTS)</span>
            </div>

            <button id="btn-restart" class="btn-restart-pill" aria-label="Restart Board Instantly">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span>RESTART</span>
            </button>
          </div>
        </section>

        <!-- SCREEN 4: TILE SKIN DRAWER (MODAL BOTTOM SHEET) -->
        <div id="skin-drawer-overlay" class="modal-backdrop hidden"></div>
        <div id="skin-drawer" class="bottom-sheet-drawer hidden" role="dialog" aria-modal="true" aria-label="Tile Skin Selector">
          <div class="drawer-header">
            <h3 class="drawer-title">SELECT TILE EMBLEM</h3>
            <button id="btn-close-skins" class="btn-close-icon" aria-label="Close Skins Drawer">
              <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
          <div id="skin-list" class="skin-list-grid"></div>
        </div>

        <!-- SCREEN 5: POST-GAME FLEX CARD MODAL -->
        <div id="flex-modal-overlay" class="modal-backdrop hidden"></div>
        <div id="flex-modal" class="flex-card-modal hidden" role="dialog" aria-modal="true" aria-label="Round Summary">
          <div class="glass-card flex-receipt-card">
            <div class="flex-receipt-header">
              <h2 id="flex-title" class="flex-title title-win">★ BOARD CLEARED! ★</h2>
              <div class="flex-avatar-frame">
                <img id="flex-avatar" src="./assets/avatar_default.png" alt="Victory Bitmoji" onerror="this.src='./assets/avatar_default.png'" />
              </div>
            </div>

            <div class="flex-score-block">
              <span class="flex-score-label">FINAL SCORE</span>
              <div id="flex-score" class="flex-score-number">0</div>
              <div id="flex-pb-badge" class="pb-badge hidden">🏆 NEW PERSONAL BEST!</div>
            </div>

            <div class="receipt-divider"></div>

            <table class="receipt-table">
              <tbody>
                <tr>
                  <td>⏱ Time Left</td>
                  <td id="flex-time-bonus" class="table-val">+0 pts</td>
                </tr>
                <tr>
                  <td>🎯 Flips Efficiency</td>
                  <td id="flex-flip-bonus" class="table-val">+0 pts</td>
                </tr>
                <tr>
                  <td>🔥 Streak Bonus</td>
                  <td id="flex-streak-bonus" class="table-val">+0 pts</td>
                </tr>
              </tbody>
            </table>

            <div id="flex-unlocks" class="unlock-toasts-box hidden"></div>

            <div class="flex-actions-col">
              <button id="btn-flex-play-again" class="btn-primary-cta">
                <span>PLAY AGAIN</span>
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path d="M8 5v14l11-7z" />
                </svg>
              </button>

              <button id="btn-flex-leaderboard" class="btn-secondary-pill">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                <span>VIEW FRIEND LEADERBOARD</span>
              </button>

              <button id="btn-flex-change-level" class="btn-subtle-link">
                BACK TO LOBBY
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Application Script Entry Point -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
